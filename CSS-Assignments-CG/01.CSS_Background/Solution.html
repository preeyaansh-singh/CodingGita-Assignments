<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Practice</title>
  <style>
    /* Q1 */
    .q1 {
      background-color: lightblue;
      padding: 20px;
    }

    /* Q2 */
    .q2 {
      background-color: #ff6347;
      padding: 20px;
    }

    /* Q3 */
    .q3 {
      background-color: rgb(255, 192, 203);
      padding: 20px;
    }

    /* Q4 */
    .q4 {
      background-color: rgba(0, 128, 0, 0.3);
      padding: 20px;
    }

    /* Q5 */
    .q5 {
      background-image: url("flower.png");
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q6 */
    .q6 {
      background-image: url("pattern.png");
      background-repeat: repeat-x;
      height: 100px;
    }

    /* Q7 */
    .q7 {
      background-image: url("stripe.png");
      background-repeat: repeat-y;
      height: 200px;
    }

    /* Q8 */
    .q8 {
      background-image: url("dot.png");
      background-repeat: space;
      height: 200px;
    }

    /* Q9 */
    body {
      background-image: url("landscape.jpg");
      background-attachment: fixed;
    }

    /* Q10 */
    .q10 {
      background-image: url("bg-image.jpg");
      background-attachment: scroll;
      height: 300px;
      overflow: auto;
    }

    /* Q11 */
    .q11 {
      background-image: url("texture.png");
      background-attachment: local;
      height: 200px;
      overflow: auto;
    }

    /* Q12 */
    header {
      background-image: url("header-bg.jpg");
      background-color: #cccccc;
      height: 150px;
    }

    /* Q13 */
    .q13 {
      background-image: linear-gradient(to right, red, yellow);
      height: 100px;
    }

    /* Q14 */
    .q14 {
      background-image: url("star.png"), url("cloud.png");
      background-position: top left, bottom right;
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q15 */
    .q15 {
      background-image: radial-gradient(circle, blue, white);
      height: 200px;
    }

    /* Q16 */
    .q16 {
      background-image: url("icon.png");
      background-position: center;
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q17 */
    .q17 {
      background-image: url("logo.png");
      background-position: 50% 75%;
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q18 */
    .q18 {
      background-image: url("pattern.png");
      background-position: 10px 20px;
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q19 */
    .q19 {
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 200px;
    }

    /* Q20 */
    .q20 {
      background-image: url("pattern.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      height: 200px;
    }

    div, section, article, aside {
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <header>Header (Q12)</header>

  <div class="q1">Q1</div>
  <section class="q2">Q2</section>
  <article class="q3">Q3</article>
  <aside class="q4">Q4</aside>

  <div class="q5">Q5</div>
  <section class="q6">Q6</section>
  <article class="q7">Q7</article>
  <aside class="q8">Q8</aside>

  <div class="q10">Q10 Scroll Content<br>More content<br>More content</div>
  <section class="q11">Q11 Scroll Content<br>More content<br>More content</section>

  <div class="q13">Q13</div>
  <section class="q14">Q14</section>
  <article class="q15">Q15</article>

  <div class="q16">Q16</div>
  <section class="q17">Q17</section>
  <article class="q18">Q18</article>

  <article class="q19">Q19</article>
  <aside class="q20">Q20</aside>

</body>
</html>

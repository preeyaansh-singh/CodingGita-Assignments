<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Iframe with Gyroscope</title>
</head>
<body>

    <h2>Video Player</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="Embedded Video Player"
        allow="fullscreen; gyroscope"
        allowfullscreen>
    </iframe>

</body>
</html>
